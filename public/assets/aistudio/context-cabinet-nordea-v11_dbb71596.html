/* Layout: a phone on a quiet stage — status bar, scrolling screen, bottom tab bar; setup is a tap-only flow inside the same frame */
:root{
  --stage:#E7E9F2; --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#ECEEF6; --line:#D9DCE9;
  --ink:#10132B; --ink-2:#434866; --muted:#6B7090;
  --brand:#0000A0; --brand-ink:#FFFFFF; --brand-soft:#0000A0; --mint:#0000A0;
  --you:#0E7A69; --you-bg:#DCF0EB; --bank:#B0461F; --bank-bg:#FBE7DE; --grey:#5F6B77; --grey-bg:#E7EBEF;
  --ok:#1C7439; --ok-bg:#DCEFE1; --warn:#8A5D00; --warn-bg:#FBEFD0; --danger:#A9261F;
  --sel:#E6E8FF; --focus:#2E6BE6; --shadow:0 1px 2px rgba(19,33,31,.06),0 4px 14px rgba(19,33,31,.05);
  --f-ui:'Noto Sans','Segoe UI',Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#07081A; --bg:#0D0F24; --surface:#161935; --surface-2:#1E2242; --line:#2D3256;
  --ink:#E8EAFA; --ink-2:#B6BAD9; --muted:#8A8FB3;
  --brand:#0A0A78; --brand-ink:#EEF0FF; --brand-soft:#9EA6FF; --mint:#8E98FF;
  --you:#4CC4AF; --you-bg:#11332D; --bank:#F09A76; --bank-bg:#3A2017; --grey:#A3AFBB; --grey-bg:#222D38;
  --ok:#6FCF8D; --ok-bg:#163221; --warn:#F0C25A; --warn-bg:#382B0F; --danger:#F2867F;
  --sel:#232866; --focus:#7FA6FF; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#07081A; --bg:#0D0F24; --surface:#161935; --surface-2:#1E2242; --line:#2D3256;
  --ink:#E8EAFA; --ink-2:#B6BAD9; --muted:#8A8FB3;
  --brand:#0A0A78; --brand-ink:#EEF0FF; --brand-soft:#9EA6FF; --mint:#8E98FF;
  --you:#4CC4AF; --you-bg:#11332D; --bank:#F09A76; --bank-bg:#3A2017; --grey:#A3AFBB; --grey-bg:#222D38;
  --ok:#6FCF8D; --ok-bg:#163221; --warn:#F0C25A; --warn-bg:#382B0F; --danger:#F2867F;
  --sel:#232866; --focus:#7FA6FF; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:0}
.caption{max-width:390px;margin-top:-6px;width:100%;color:var(--muted);font-size:13px;text-align:center;margin-bottom:12px}
.caption b{color:var(--ink)}
/* Phone */
.phone{width:410px;height:864px;min-height:0;max-width:none;transform-origin:top left;position:absolute;left:0;top:0;background:var(--bg);border:10px solid #0B0F12;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.phone-holder{position:relative;flex:none;width:410px;height:864px}
.screen,.chat-body{scrollbar-width:none}.screen::-webkit-scrollbar,.chat-body::-webkit-scrollbar{display:none}
@media (max-width:480px) and (pointer:coarse){.phone-holder{width:100%!important;height:100dvh!important}.phone{position:relative;transform:none!important;border:0;border-radius:0;width:100%;height:100dvh;box-shadow:none}.foot{display:none}.caption{display:none}body{padding-block:0}}
.status{flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 26px 6px;font-size:14px;font-weight:600;color:var(--brand-ink);background:var(--brand)}
.status.light{background:var(--bg);color:var(--ink)}
.batt{display:inline-block;width:24px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative;margin-left:6px;vertical-align:-1px}
.batt::after{content:"";position:absolute;inset:1.5px 6px 1.5px 1.5px;background:currentColor;border-radius:1px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 10px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 0}
.nav button[aria-selected="true"]{color:var(--brand-soft)}
.nav svg{width:22px;height:22px}
.badge-n{position:absolute;margin-left:18px;margin-top:-4px;min-width:16px;height:16px;border-radius:99px;background:var(--bank);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.navi{position:relative;display:flex;flex-direction:column;align-items:center}
/* Header band */
.band{background:var(--brand);color:var(--brand-ink);padding:8px 20px 22px;display:flex;flex-direction:column;gap:14px}
.brandbar{background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:space-between;padding:6px 20px 2px}
.brandbar .word{font-size:22px;font-weight:600;letter-spacing:0}
.brandbar .concept{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.16);color:var(--brand-ink)}
.band-top{display:flex;justify-content:space-between;align-items:center}
.band h1{font-size:22px;font-weight:700}
.band p{color:var(--brand-ink);opacity:.85;font-size:14px}
.pts{border:0;background:rgba(255,255,255,.14);color:var(--brand-ink);font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:99px;cursor:pointer;font-variant-numeric:tabular-nums}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.lift{margin-top:-14px}
/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h3{font-size:16px;font-weight:700}
.card p{color:var(--ink-2)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.from{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.from::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.from.you{color:var(--you)}.from.bank{color:var(--bank)}.from.grey{color:var(--grey)}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-2)}
.btn.link{border:0;background:none;padding:2px 0;min-height:0;color:var(--brand-soft);font-weight:600;font-size:14px}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:6px 12px;font-size:13.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.stack{flex-direction:column}
.sec-title{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 0}
.sec-title h2{font-size:16px;font-weight:700}
.earns{font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:6px;align-self:flex-start}
.earns.no{background:var(--ok-bg);color:var(--ok)}.earns.yes{background:var(--bank-bg);color:var(--bank)}
/* Goal card */
.goal .status-pill{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;align-self:flex-start}
.status-pill.bad{background:var(--warn-bg);color:var(--warn)}.status-pill.good{background:var(--ok-bg);color:var(--ok)}
.amount{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.amount span{font-size:15px;color:var(--muted);font-weight:600}
.track{position:relative;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--mint)}
.track i.later{opacity:.3}
.p-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.p-row b{color:var(--ink);font-variant-numeric:tabular-nums}
/* Notification */
.notif{background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.notif-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.app-ico{width:22px;height:22px;border-radius:6px;background:var(--brand);display:grid;place-items:center}
.app-ico span{width:9px;height:11px;border:2px solid var(--brand-ink);border-radius:2px}
.notif h3{font-size:15.5px;font-weight:700}
/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{padding:13px 16px;display:flex;flex-direction:column;gap:6px}
.row+.row{border-top:1px solid var(--line)}
.row-main{display:flex;gap:12px;align-items:center}
.row-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row h4{margin:0;font-size:15px;font-weight:600}
.row p{color:var(--ink-2);font-size:14px}
.row .meta{font-size:12.5px;color:var(--muted)}
.more{flex:none;border:0;background:var(--surface-2);border-radius:99px;width:34px;height:34px;cursor:pointer;color:var(--ink-2);font-weight:700;font-size:16px;line-height:1}
.dotc{flex:none;width:10px;height:10px;border-radius:50%}
.dotc.you{background:var(--you)}.dotc.bank{background:var(--bank)}.dotc.grey{background:var(--grey)}
.why{background:var(--surface-2);border-radius:12px;padding:10px 12px;color:var(--ink-2);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* Setup */
.setup{display:flex;flex-direction:column;min-height:100%;padding:8px 20px 20px;gap:18px;background:var(--bg)}
.s-top{display:flex;align-items:center;gap:12px}
.s-back{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-weight:700;font-size:18px;color:var(--ink-2)}
.s-prog{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.s-prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .25s}
.s-skip{border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;font-size:14px}
.s-q{display:flex;flex-direction:column;gap:8px}
.s-q .kicker{color:var(--brand-soft)}
.s-q h1{font-size:24px;font-weight:700;line-height:1.2}
.s-q p{color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;cursor:pointer;min-height:60px}
.opt:hover{border-color:var(--brand-soft)}
.opt .let{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.opt .t{flex:1;display:flex;flex-direction:column}
.opt .t b{font-size:15.5px}
.opt .t span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--brand-soft);background:var(--sel)}
.opt[aria-pressed="true"] .let{background:var(--brand);color:var(--brand-ink)}
.rec{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:2px 7px;border-radius:6px;margin-left:6px}
.found{display:flex;flex-direction:column;gap:10px}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left}
.fact[aria-pressed="true"]{border-color:var(--brand)}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:1px}
.fact[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.fact b{display:block;font-size:15px}
.fact span{font-size:13.5px;color:var(--ink-2)}
.s-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.s-hint{font-size:12.5px;color:var(--muted);text-align:center}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sum-row{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2)}
.sum-row b{color:var(--ink)}
.hero-word{display:flex;align-items:center;gap:10px;margin-top:20px}
.hero-word .word{font-size:30px;font-weight:600;letter-spacing:0;color:var(--brand-soft)}
.hero-word .concept{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--sel);color:var(--brand-soft)}
.hero-ico{width:64px;height:64px;border-radius:20px;background:var(--brand);display:grid;place-items:center;margin-top:24px}
.hero-ico span{width:24px;height:30px;border:3px solid var(--brand-ink);border-radius:5px;position:relative}
.hero-ico span::after{content:"";position:absolute;left:2px;right:2px;top:10px;border-top:3px solid var(--brand-ink)}
/* Ask */
.thread{display:flex;flex-direction:column;gap:12px}
.qb{align-self:flex-end;background:var(--brand);color:var(--brand-ink);padding:9px 14px;border-radius:18px 18px 4px 18px;font-weight:600;max-width:85%}
.verdict{font-size:20px;font-weight:700;line-height:1.25}
.verdict.bad{color:var(--warn)}.verdict.good{color:var(--ok)}.verdict.none{color:var(--ink-2)}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.facts li{display:flex;flex-direction:column;gap:1px}
.facts li span{color:var(--ink-2);font-size:14px}
.askbar{flex:none;display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.askbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:10px 14px;background:var(--bg);font-size:15px}
.askbar button{border:0;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:0 16px;cursor:pointer}
.askbar button:disabled{opacity:.45;cursor:not-allowed}
/* Rewards / Me */
.big{font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.level{font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.meter{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-radius:99px}
.meter.warm i{background:var(--warn)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.checklist li{display:flex;gap:10px;align-items:center}
.tick{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.tick.ok{background:var(--ok-bg);color:var(--ok)}
.checklist .l{flex:1;font-size:14px}
.miles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mile{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:1px;text-align:center}
.mile b{font-size:15px}
.mile span{font-size:11.5px;color:var(--muted)}
.mile.won{border-color:var(--ok);background:var(--ok-bg)}.mile.won span{color:var(--ok)}
.mile.base{background:var(--surface-2);border-color:transparent}
.rules{width:100%;border-collapse:collapse;font-size:14px}
.rules td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.rules tr:first-child td{border-top:0}
.rules td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:10px}
.never{background:var(--surface-2);border-radius:12px;padding:10px 12px;color:var(--ink-2);font-size:13.5px}
.never b{color:var(--ink)}
.celebrate{border-color:var(--ok);background:var(--ok-bg)}.celebrate h3{color:var(--ok)}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;cursor:pointer;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);min-height:32px}
.toggle .knob{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.toggle .knob::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--surface);top:2px;left:2px;transition:left .15s}
.toggle[aria-pressed="true"] .knob{background:var(--mint)}
.toggle[aria-pressed="true"] .knob::after{left:14px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.activity{list-style:none;margin:0;padding:0}
.activity li{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px}
.activity li:first-child{border-top:0}
.activity .d{flex:none;width:72px;color:var(--muted);font-variant-numeric:tabular-nums}
.w-nordea{color:var(--bank);font-weight:700}.w-you{color:var(--you);font-weight:700}.w-assistant{color:var(--grey);font-weight:700}
.stagewrap{display:flex;gap:20px;align-items:flex-start;justify-content:center;width:100%}
.nordea{width:380px;max-width:100%;max-height:min(844px,calc(100vh - 110px));overflow-y:auto;background:#0B0E26;color:#E8EAFA;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.nordea h2{font-size:18px;font-weight:700}.nordea p{color:#B6BAD9}
.nordea .chip{background:#161935;border-color:#2D3256;color:#E8EAFA;font-size:12.5px;padding:6px 11px}.nordea .chip.on{background:#E8EAFA;color:#0B0E26;border-color:#E8EAFA}
.nordea .btn{background:#161935;border-color:#2D3256;color:#E8EAFA}.nordea .btn.link{background:none;color:#9EA6FF;align-self:flex-start}
.n-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.n-tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#F0C25A}
.n-purpose{font-size:13.5px}.n-purpose b{color:#E8EAFA}
.n-sec{background:#161935;border:1px solid #2D3256;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.n-sec h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between}.n-sec h3 span{font-variant-numeric:tabular-nums}
.n-sec.ok h3{color:#6FCF8D}.n-sec.no h3{color:#F2867F}.n-sec.gate h3{color:#F0C25A}
.n-sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.n-sec li{display:flex;flex-direction:column;gap:1px}.n-sec li b{font-weight:600;color:#E8EAFA}.n-sec li span{color:#B6BAD9;font-size:13px}
.n-sec .from.bank{color:#F09A76}.n-sec .from.you{color:#4CC4AF}
.n-note{font-size:12.5px}
.n-json{background:#05061A;border-radius:12px;padding:12px;font-size:11.5px;line-height:1.45;overflow-x:auto;white-space:pre;color:#B6BAD9;margin:0}
.nordea[hidden]{display:none}
@media (max-width:900px){.stagewrap{flex-direction:column;align-items:center}.nordea{max-height:none}}
.status-pill.neutral{background:var(--sel);color:var(--brand-soft)}
.paceline{font-size:13.5px;font-weight:600}.paceline.bad{color:var(--warn)}.paceline.good{color:var(--ok)}
.compare-cta{border:1.5px solid var(--brand-soft);background:var(--sel)}
.cmp-tag{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.cmp-tag.empty{background:var(--grey-bg);color:var(--grey)}.cmp-tag.full{background:var(--sel);color:var(--brand-soft)}
.demo-persona{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.demo-persona .chip{padding:5px 11px;font-size:12.5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 2px}
.drawer{display:flex;flex-direction:column;gap:8px}
.drawer-h{display:flex;align-items:center;gap:10px;padding:0 2px}
.drawer-h .dico{width:30px;height:30px;border-radius:9px;background:var(--sel);color:var(--brand-soft);display:grid;place-items:center}
.drawer-h .dico svg{width:17px;height:17px}
.drawer-h h3{font-size:15px;font-weight:700;flex:1}
.seen{font-size:12px;color:var(--muted)}
.seen.off{color:var(--warn)}
.perm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.card.ask{border-color:var(--you);border-width:1.5px}
.card.ask.done{border-width:1px;border-color:var(--line);padding:12px 16px;gap:4px}
.redeem{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.redeem li{display:flex;gap:10px;align-items:center}
.redeem .l{flex:1;display:flex;flex-direction:column;font-size:14px}.redeem .l span{font-size:12.5px;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.acct span{font-size:12px;color:var(--muted);font-weight:600}.acct b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.impact{align-self:flex-start;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sel);color:var(--brand-soft)}
/* One page */
.one-head{background:var(--brand);color:var(--brand-ink);padding:8px 20px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.one-head .brandword{font-size:20px;font-weight:600;letter-spacing:0;margin-right:8px}
.concept-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.16)}
.one-head h1{font-size:21px;font-weight:700;margin-top:8px}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;border:0;background:#2A39C4}
.avatar.big{width:42px;height:42px;font-size:17px;cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.a-new{background:#2A39C4}.a-lauri{background:#0E7A69}.a-aino{background:#7A3EC8}
.body.one{gap:16px}
.money{gap:10px;margin-top:-12px}
.bal{color:var(--ink)!important;font-size:34px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:1.1}
.pts-chip{border:0;background:var(--sel);color:var(--brand-soft);font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:99px;cursor:pointer}
.qa-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.qa-btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink)}
.qi{width:32px;height:32px;border-radius:50%;background:var(--sel);color:var(--brand-soft);display:grid;place-items:center;font-size:15px;font-weight:700}
.one-sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:8px}
.goal-chips{display:flex;flex-direction:column;gap:8px}
.goal-chip{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.goal-chip.on{border-color:var(--brand-soft);background:var(--sel)}
.gname{font-weight:600;font-size:14.5px}.gamt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}.gamt span{font-weight:600;color:var(--muted);font-size:12.5px}
.gbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}.gbar i{display:block;height:100%;background:var(--mint);border-radius:99px}
.gst{grid-column:1/-1;font-size:12.5px;font-weight:600}.gst.good{color:var(--ok)}.gst.bad{color:var(--warn)}
.compare-row{border:1.5px solid var(--brand-soft);background:var(--sel);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;color:var(--ink)}
.compare-row span{font-size:13px;color:var(--brand-soft);font-weight:600}
.embed .band{display:none}.embed>.body{padding:0}.embed .lift{margin-top:0}
.embed .body>.card.compare-cta{display:none}
.foot-note{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 0 8px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:25;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:20px;display:flex;flex-direction:column;gap:10px}
.user-row{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;color:var(--ink)}
.user-row.on{border-color:var(--brand-soft);background:var(--sel)}
.user-row .t{flex:1;display:flex;flex-direction:column}.user-row .t span{font-size:12.5px;color:var(--muted)}
.embed .tell,.embed .empty-hint{display:none}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.hint{font-size:12.5px;color:var(--muted)}
.legend.small{gap:10px}.legend.small .from{font-size:12px}
/* Toast + demo */
.toast{position:absolute;left:12px;right:12px;top:52px;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:20;text-align:center}
.simbar{background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:700;text-align:center;padding:5px 10px}
.demo-btn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:14px;padding:10px 16px;cursor:pointer;box-shadow:var(--shadow)}
.demo-panel{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:30;width:min(320px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px}
.demo-panel h3{font-size:15px;font-weight:700}
.demo-panel p{font-size:13px;color:var(--muted)}
.dsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dsteps li{display:flex;gap:10px;font-size:13.5px;color:var(--ink-2)}
.dsteps li b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--muted)}
.dsteps li.done{color:var(--ok)}.dsteps li.done b{background:var(--ok-bg);color:var(--ok)}
.dsteps li.next{color:var(--ink);font-weight:700}.dsteps li.next b{background:var(--ink);color:var(--surface)}
.foot{max-width:390px;width:100%;color:var(--muted);font-size:12px;text-align:center;margin-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Nordea design layer: deep blue header, logo, round quick actions, flatter cards ===== */
:root{--bg:#F4F4F6;--line:#E3E3EA;--r-card:8px}
.card,.list,.summary,.goal-chip,.compare-row,.acct,.opt,.fact,.user-row,.qa-btn{border-radius:var(--r-card)}
.card,.list{box-shadow:0 1px 3px rgba(0,0,30,.07);border-color:transparent}
.btn{border-radius:6px}.btn.link{color:var(--brand-soft)}
.one-head{display:block;padding:6px 20px 34px;background:radial-gradient(120% 90% at 100% 0%,rgba(80,90,255,.45) 0%,rgba(0,0,160,0) 55%),linear-gradient(170deg,#0000A0 0%,#00007A 100%);position:relative;overflow:hidden}
.one-head::after{content:"";position:absolute;right:-30px;top:-10px;width:200px;height:140px;opacity:.16;background:repeating-linear-gradient(30deg,#fff 0 1px,transparent 1px 16px),repeating-linear-gradient(150deg,#fff 0 1px,transparent 1px 16px);pointer-events:none}
.nh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.nh-right{display:flex;align-items:center;gap:10px}
.nh-bell{border:0;background:none;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0}
.bell{position:relative;display:inline-flex}.bell i{position:absolute;top:-4px;right:-6px;min-width:16px;height:16px;border-radius:99px;background:#E4002B;color:#fff;font-size:10px;font-style:normal;font-weight:600;display:grid;place-items:center;padding:0 4px}
.one-head .avatar{width:32px;height:32px;font-size:14px;box-shadow:0 0 0 2px rgba(255,255,255,.55);cursor:pointer}
.nlogo{display:block;height:32px;width:auto;margin-top:18px;position:relative;z-index:1}
.one-head h1{font-size:15px;font-weight:600;margin-top:10px;position:relative;z-index:1}
.nlogo.hero{height:30px;margin:0}
.hero-word{margin-top:24px}
.concept-tag{background:rgba(255,255,255,.14);color:#fff}
.money{margin-top:-20px}
.qa-row{gap:4px}
.qa-btn{border:0;background:none;padding:6px 2px;font-weight:500;font-size:12.5px;gap:8px}

const PLAN_IMPACT=new Set(["home_when","home_deposit","partner_saving","partner_amount","partner_count","loans","repay","work","other_savings","car_fund","goal_priority","buffer","big_costs","pay_perm","income_change"]);

  const pend=QUESTIONS.filter(q=>!S.qa.done[q.id]&&!exclude.includes(q.id)&&!(S.qa.chatSkip||{})[q.id]&&(!q.when||q.when()));

function pendingQuestions(){
  const out=[];

  const refresh=[];for(const e of S.entries)if(isOld(e)&&S.qa.skipped["old:"+e.id]!==nowMonth())refresh.push({id:"old:"+e.id,old:e.id,q:`Is this still true? “${e.title}”`,sub:`You told us this in ${fmtMonthLong((e.confirmedAt||e.createdAt).slice(0,7))}.`,opts:[["yes","Yes, still true"],["no","Not anymore"]]});

const qaPaused=()=>S.qa.pausedMonth===nowMonth();

// ============ Assistant answers ============
const usable=e=>e.status==="active"&&(e.source!=="nordea"||e.reviewed);
const FROM={customer:["you","You told us"],nordea:["bank","Nordea noticed"],account:["grey","Your account"]};

function answerFor(mode){
  const bal=curBalance();
  if(mode==="empty")return{verdict:"I can’t tell you yet",cls:"none",lead:"I don’t know what you’re saving for, so I can only tell you what’s in your account.",facts:[{k:"account",t:`You have ${eur(bal)} in savings.`}],options:[]};
  const ot=onTrack();
  if(!ot.hasGoal)return{verdict:"Tell me what you’re saving for",cls:"none",lead:"Add a goal with an amount and a date, and I can tell you if you’re on track.",facts:[{k:"account",t:`You have ${eur(bal)} in savings.`}],options:[{t:"Add a goal",act:"add-goal"}]};
  const g=ot.goal,gm=fmtMonthLong(g.target.date.slice(0,7));
  const facts=[{k:"customer",t:`You want ${eur(g.target.amount)} for “${g.title}” by ${gm}.`},{k:"account",t:ot.split?`${eur(ot.balance)} of your savings and ${eur(ot.monthly)} a month go to this goal (${Math.round(ot.share*100)}%, split by goal size).`:`You have ${eur(ot.balance)} saved and save ${eur(ot.monthly)} a month.`}];
  if(ot.partnerM)facts.push({k:"customer",t:`You said your partner saves about ${eur(ot.partnerM)} a month for it, and to count it.`});
  if(byId("salary")&&usable(byId("salary")))facts.push({k:"nordea",t:`Your salary went up by ${eur(SALARY.diff)} a month in ${fmtMonthLong(SALARY.month)}.`});
  const rest=byId("restaurants");if(rest?.answer==="newnormal")facts.push({k:"customer",t:`You said eating out more is your new normal (about ${eur(SPEND.extra)} a month).`});else if(rest?.answer==="busy")facts.push({k:"customer",t:"You said eating out more is just a busy time, so I didn’t count it."});
  if(byId("risk")&&usable(byId("risk")))facts.push({k:"customer",t:"You prefer low-risk saving, so I only suggest saving more."});
  const options=[];
  if(!ot.onTrack){options.push({t:`Save ${eur(ot.nudge)} more a month`,earns:false,act:"tip-yes",amt:ot.nudge});if(byId("car")?.status==="archived")options.push({t:`Or move your ${eur(ACCOUNTS.carFund.balance)} car fund and save ${eur(ot.nudgeWithCar)} more`,earns:false});}
  return{verdict:ot.onTrack?`Yes, you’re on track for ${gm}`:`Not yet. You’re about ${eur(ot.gap)} short.`,cls:ot.onTrack?"good":"bad",
    lead:`At ${eur(ot.monthly)} a month you’ll have about ${eur(ot.projected)} by ${gm}.`,progress:ot,facts,options,
    unseen:!ot.partnerM&&byId("partner")&&usable(byId("partner"))&&/partner/.test(g.title)?"I can’t see your partner’s savings, so your real picture may be better.":""};
}

function blockReason(e){

  const rules=`You are Abel, ${S.name}’s banking assistant`+" in a student prototype. Sound like a warm, caring person texting, not a bot: short, natural, no lists unless asked. Notice feelings and acknowledge them first. Ask at most one gentle question. Answer ONLY from CONTEXT. Use only numbers in CONTEXT; never invent figures. After each fact add its source in brackets exactly as given: [You told us], [Nordea noticed], [Your account], [Calculated], [Your rewards]. Only tag a fact [You told us] if it is in known with that source. Points and levels are in rewards. Never use items in not_used. If something is missing, say what. At most 60 words, no markdown.";
  let last=0;
  try{const{text}=await withTimeout(sample(`${rules}\n\nCONTEXT:\n${JSON.stringify(contextForAI(),null,1)}\n\nQUESTION: ${q}`,{cache:false,modelTier:"quick",onText:({text})=>{msg.text=text;const n=Date.now();if(n-last>250){last=n;render();}}}),30000);
    if(!String(text||"").trim())throw {code:"empty"};msg.text=text;msg.src="Answered by Claude from what you’ve approved";}
  catch(err){if(["not_granted","sampling_disabled"].includes(err?.code))sample=null;
    UI.aiBusy=false;msg.text="";if(pushLocal(q,msg))return;
    msg.text=(err?.code==="timeout"?"That took too long. ":"")+"I couldn’t answer that right now. Try “Am I on track?” or “How much do I have?”.";msg.src="Abel";}
  UI.aiBusy=false;save();render();
}
// Device mockup: the phone keeps its real 390x844 screen and is scaled as a whole to fit the window.
function fitPhone(){
  const hold=document.getElementById("pholder"),ph=document.getElementById("phone");if(!hold||!ph)return;
  if(innerWidth<=480&&matchMedia("(pointer:coarse)").matches){hold.style.width="";hold.style.height="";ph.style.transform="";return;}
  const top=hold.getBoundingClientRect().top+scrollY;const footH=(document.querySelector(".foot")?.offsetHeight||0)+28;
  const s=Math.min(1,(innerHeight-top-footH)/864,(innerWidth-24)/410);const k=Math.max(.4,s);
  ph.style.transform=`scale(${k})`;hold.style.width=410*k+"px";hold.style.height=864*k+"px";
}
addEventListener("resize",fitPhone);fitPhone();
render();
</script>
